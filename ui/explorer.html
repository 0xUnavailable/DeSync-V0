<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeSync Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }
    h1, h2 { margin: 10px; }
    .section { padding: 10px; margin: 10px; background: #222; border-radius: 6px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .metric-card {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid #0f0;
    }
    .metric-card h3 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: #aaa;
    }
    .metric-card .value {
      font-size: 24px;
      font-weight: bold;
      color: #0f0;
    }
    .error {
      background: #4a1a1a;
      border-left: 3px solid #f33;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; table-layout: fixed; }
    th, td {
      border: 1px solid #444;
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
      word-break: break-all;
      white-space: pre-wrap;
      max-width: 300px;
      font-size: 12px;
    }
    th { background: #333; }
    tr:nth-child(even) { background: #1a1a1a; }
    p { margin: 5px 0; }
    .controls {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .controls input {
      padding: 4px;
      border: 1px solid #444;
      background: #111;
      color: #eee;
      flex: 1;
      max-width: 300px;
    }
    .controls button {
      padding: 4px 8px;
      background: #333;
      border: none;
      color: #eee;
      cursor: pointer;
      border-radius: 3px;
    }
    .controls button:hover {
      background: #444;
    }
    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .debug-info {
      background: #1a2a3a;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #aaf;
    }
  </style>
</head>
<body>
  <h1>DeSync Explorer</h1>

  <div class="section">
    <h2>Connection Status</h2>
    <div id="debug-info" class="debug-info">Initializing...</div>
  </div>

  <div class="section">
    <h2>Node Status</h2>
    <div class="metrics">
      <div class="metric-card">
        <h3>Total Blocks</h3>
        <div class="value" id="block-count">0</div>
      </div>
      <div class="metric-card">
        <h3>State Keys</h3>
        <div class="value" id="state-keys">0</div>
      </div>
      <div class="metric-card">
        <h3>Node Role</h3>
        <div class="value" id="role" style="font-size: 18px;">-</div>
      </div>
    </div>
    <div id="status"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>World State</h2>
    <div class="controls">
      <input type="text" id="search-world" placeholder="Search plots..." />
      <div>
        <button id="prev-world" onclick="changePage('world', -1)">Prev</button>
        <span id="page-world">Page 1 / 1</span>
        <button id="next-world" onclick="changePage('world', 1)">Next</button>
      </div>
    </div>
    <div id="world"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>Latest Block</h2>
    <div class="controls">
      <input type="text" id="search-block" placeholder="Search block txs..." />
      <div>
        <button id="prev-block" onclick="changePage('block', -1)">Prev</button>
        <span id="page-block">Page 1 / 1</span>
        <button id="next-block" onclick="changePage('block', 1)">Next</button>
      </div>
    </div>
    <div id="block"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>All Transactions</h2>
    <div class="controls">
      <input type="text" id="search-txs" placeholder="Search all txs..." />
      <div>
        <button id="prev-txs" onclick="changePage('txs', -1)">Prev</button>
        <span id="page-txs">Page 1 / 1</span>
        <button id="next-txs" onclick="changePage('txs', 1)">Next</button>
      </div>
    </div>
    <div id="txs"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>Tax Events (Latest Month)</h2>
    <div class="controls">
      <input type="text" id="search-tax" placeholder="Search tax events..." />
      <div>
        <button id="prev-tax" onclick="changePage('tax', -1)">Prev</button>
        <span id="page-tax">Page 1 / 1</span>
        <button id="next-tax" onclick="changePage('tax', 1)">Next</button>
      </div>
    </div>
    <div id="tax"><p>Loading...</p></div>
  </div>

  <script>
    const API = "http://localhost:8080";
    const state = {
      world: { page: 1, data: [] },
      block: { page: 1, data: [] },
      txs: { page: 1, data: [] },
      tax: { page: 1, data: [] }
    };

    let debugLog = [];

    function log(msg, data = null) {
      const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
      const logEntry = `[${timestamp}] ${msg}`;
      debugLog.push(logEntry);
      if (data) {
        console.log(msg, data);
        debugLog.push(JSON.stringify(data, null, 2).substring(0, 500));
      } else {
        console.log(msg);
      }
      
      // Keep only last 20 entries
      if (debugLog.length > 20) debugLog.shift();
      
      const debugEl = document.getElementById("debug-info");
      if (debugEl) {
        debugEl.textContent = debugLog.slice(-10).join('\n');
      }
    }

    async function fetchJSON(url) {
      log(`Fetching: ${url}`);
      try {
        const res = await fetch(url);
        log(`Response status: ${res.status}`);
        
        if (!res.ok) {
          const text = await res.text();
          log(`Error response: ${text}`);
          throw new Error(`HTTP ${res.status}: ${text}`);
        }
        
        const data = await res.json();
        log(`Received data:`, data);
        return data;
      } catch (err) {
        log(`Fetch error: ${err.message}`);
        throw err;
      }
    }

    async function loadStatus() {
      try {
        const st = await fetchJSON(`${API}/status`);
        
        document.getElementById("block-count").textContent = st.block_count || 0;
        document.getElementById("state-keys").textContent = st.state_keys || 0;
        document.getElementById("role").textContent = st.role || "unknown";
        
        document.getElementById("status").innerHTML = `
          <p><strong>Peer ID:</strong> ${st.peer_id || 'N/A'}</p>
          <p><strong>Ready:</strong> ${st.ready || false}</p>
          <p><strong>API Version:</strong> ${st.api_version || 'N/A'}</p>
        `;
        log("Status loaded successfully");
      } catch (err) {
        document.getElementById("status").innerHTML = `<div class="error">Error: ${err.message}</div>`;
        log(`Status error: ${err.message}`);
      }
    }

    async function loadWorldState() {
      try {
        const plots = await fetchJSON(`${API}/state/world`);
        log(`World state received: ${plots ? plots.length : 0} items`);
        
        state.world.data = plots || [];
        state.world.page = 1;
        renderTable("world");
      } catch (err) {
        document.getElementById("world").innerHTML = `<div class="error">Error: ${err.message}</div>`;
        log(`World state error: ${err.message}`);
      }
    }

    async function loadLatestBlock() {
      try {
        const block = await fetchJSON(`${API}/blocks/latest`);
        log(`Latest block received:`, block);
        
        state.block.data = block.txs || [];
        state.block.page = 1;
        renderTable("block");
      } catch (err) {
        document.getElementById("block").innerHTML = `<div class="error">Error: ${err.message}</div>`;
        log(`Latest block error: ${err.message}`);
      }
    }

    async function loadAllTxs() {
      try {
        const txs = await fetchJSON(`${API}/txs/all`);
        log(`All transactions received: ${txs ? txs.length : 0} items`);
        
        state.txs.data = txs || [];
        state.txs.page = 1;
        renderTable("txs");
      } catch (err) {
        document.getElementById("txs").innerHTML = `<div class="error">Error: ${err.message}</div>`;
        log(`All transactions error: ${err.message}`);
      }
    }

    async function loadTaxEvents() {
      try {
        const latest = await fetchJSON(`${API}/months/latest`);
        log(`Tax events received:`, latest);
        
        state.tax.data = Array.isArray(latest) ? latest : (latest ? [latest] : []);
        state.tax.page = 1;
        renderTable("tax");
      } catch (err) {
        document.getElementById("tax").innerHTML = `<div class="error">Error: ${err.message}</div>`;
        log(`Tax events error: ${err.message}`);
      }
    }

    function renderTable(key) {
      const el = document.getElementById(key);
      const rows = state[key].data;
      const query = document.getElementById(`search-${key}`).value.toLowerCase();
      const limit = 10;
      
      if (!rows || rows.length === 0) {
        el.innerHTML = "<p>No data available</p>";
        updatePagination(key, 0, 0);
        return;
      }

      let filtered = rows;
      if (query) {
        filtered = rows.filter(r =>
          Object.values(r).some(v => String(v).toLowerCase().includes(query))
        );
      }

      const page = state[key].page;
      const start = (page - 1) * limit;
      const pageRows = filtered.slice(start, start + limit);

      if (pageRows.length === 0) {
        el.innerHTML = "<p>No matching results</p>";
        updatePagination(key, filtered.length, 0);
        return;
      }

      const keys = Object.keys(pageRows[0]);
      let html = "<table><thead><tr>";
      for (let k of keys) html += `<th>${k}</th>`;
      html += "</tr></thead><tbody>";
      
      for (let row of pageRows) {
        html += "<tr>";
        for (let k of keys) {
          let v = row[k];
          if (typeof v === "object" && v !== null) {
            v = JSON.stringify(v);
          }
          html += `<td>${v === null || v === undefined ? '-' : v}</td>`;
        }
        html += "</tr>";
      }
      html += "</tbody></table>";
      el.innerHTML = html;

      updatePagination(key, filtered.length, limit);
    }

    function updatePagination(key, totalItems, limit) {
      const totalPages = limit > 0 ? Math.ceil(totalItems / limit) : 1;
      const page = state[key].page;
      
      document.getElementById(`page-${key}`).textContent = `Page ${page} / ${totalPages}`;
      document.getElementById(`prev-${key}`).disabled = page <= 1;
      document.getElementById(`next-${key}`).disabled = page >= totalPages || totalPages === 0;
    }

    function changePage(key, delta) {
      state[key].page = Math.max(1, state[key].page + delta);
      renderTable(key);
    }

    // Add event listeners for search inputs
    ['world', 'block', 'txs', 'tax'].forEach(key => {
      document.getElementById(`search-${key}`).addEventListener('input', () => {
        state[key].page = 1;
        renderTable(key);
      });
    });

    async function refresh() {
      log("Starting refresh...");
      await loadStatus();
      await loadWorldState();
      await loadLatestBlock();
      await loadAllTxs();
      await loadTaxEvents();
      log("Refresh complete");
    }

    // Initial load
    log("DeSync Explorer initialized");
    refresh();
    
    // Auto-refresh every 10 seconds
    setInterval(refresh, 10000);
  </script>
</body>
</html>
