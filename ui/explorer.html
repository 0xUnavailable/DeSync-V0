<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeSync Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 0;
    }
    h1, h2 { margin: 10px; }
    .section { padding: 10px; margin: 10px; background: #222; border-radius: 6px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .metric-card {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid #0f0;
    }
    .metric-card h3 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: #aaa;
    }
    .metric-card .value {
      font-size: 24px;
      font-weight: bold;
      color: #0f0;
    }
    .peers-list {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      max-height: 150px;
      overflow-y: auto;
    }
    .peer-item {
      padding: 5px;
      margin: 3px 0;
      background: #252525;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; table-layout: fixed; }
    th, td {
      border: 1px solid #444;
      padding: 6px;
      text-align: left;
      word-wrap: break-word;
      word-break: break-all;
      white-space: pre-wrap;
      max-width: 300px;
    }
    th { background: #333; }
    tr:nth-child(even) { background: #1a1a1a; }
    p { margin: 5px 0; }
    .controls {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .controls input {
      padding: 4px;
      border: 1px solid #444;
      background: #111;
      color: #eee;
    }
    .controls button {
      padding: 4px 8px;
      background: #333;
      border: none;
      color: #eee;
      cursor: pointer;
    }
    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>DeSync Explorer</h1>

  <div class="section">
    <h2>Status</h2>
    <div class="metrics">
      <div class="metric-card">
        <h3>TPS (10s avg)</h3>
        <div class="value" id="tps">0</div>
      </div>
      <div class="metric-card">
        <h3>Total Blocks</h3>
        <div class="value" id="block-count">0</div>
      </div>
      <div class="metric-card">
        <h3>State Keys</h3>
        <div class="value" id="state-keys">0</div>
      </div>
      <div class="metric-card">
        <h3>Node Role</h3>
        <div class="value" id="role" style="font-size: 18px;">-</div>
      </div>
    </div>
    <div id="status"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>Connected Peers</h2>
    <div id="peers" class="peers-list"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>🌍 World State</h2>
    <div class="controls">
      <input type="text" id="search-world" placeholder="Search plots..."
        oninput="renderTable('world', window.worldState, 10, this.value, 'world')">
      <div>
        <button id="prev-world" onclick="changePage('world', -1)">Prev</button>
        <span id="page-world"></span>
        <button id="next-world" onclick="changePage('world', 1)">Next</button>
      </div>
    </div>
    <div id="world"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>Latest Block</h2>
    <div class="controls">
      <input type="text" id="search-block" placeholder="Search block txs..."
        oninput="renderTable('block', window.latestBlockTxs, 10, this.value, 'block')">
      <div>
        <button id="prev-block" onclick="changePage('block', -1)">Prev</button>
        <span id="page-block"></span>
        <button id="next-block" onclick="changePage('block', 1)">Next</button>
      </div>
    </div>
    <div id="block"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>All Transactions</h2>
    <div class="controls">
      <input type="text" id="search-txs" placeholder="Search all txs..."
        oninput="renderTable('txs', window.allTxs, 10, this.value, 'txs')">
      <div>
        <button id="prev-txs" onclick="changePage('txs', -1)">Prev</button>
        <span id="page-txs"></span>
        <button id="next-txs" onclick="changePage('txs', 1)">Next</button>
      </div>
    </div>
    <div id="txs"><p>Loading...</p></div>
  </div>

  <div class="section">
    <h2>Tax Events (Latest Month Summary)</h2>
    <div class="controls">
      <input type="text" id="search-tax" placeholder="Search tax events..."
        oninput="renderTable('tax', window.taxEvents, 10, this.value, 'tax')">
      <div>
        <button id="prev-tax" onclick="changePage('tax', -1)">Prev</button>
        <span id="page-tax"></span>
        <button id="next-tax" onclick="changePage('tax', 1)">Next</button>
      </div>
    </div>
    <div id="tax"><p>Loading...</p></div>
  </div>

  <script>
    const API = "http://localhost:8080";
    const state = {
      world: { page: 1 },
      block: { page: 1 },
      txs: { page: 1 },
      tax: { page: 1 }
    };

    let lastTxCount = 0;
    let lastTimestamp = Date.now();

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    }

    async function loadStatus() {
      try {
        const st = await fetchJSON(`${API}/status`);
        
        // Update metrics
        document.getElementById("block-count").textContent = st.block_count || 0;
        document.getElementById("state-keys").textContent = st.state_keys || 0;
        document.getElementById("role").textContent = st.role || "unknown";
        
        document.getElementById("status").innerHTML = `
          <p><strong>Peer ID:</strong> ${st.peer_id}</p>
          <p><strong>Ready:</strong> ${st.ready}</p>
          <p><strong>API Version:</strong> ${st.api_version}</p>
        `;
      } catch (err) {
        document.getElementById("status").innerHTML = `<p>Error: ${err}</p>`;
      }
    }

    async function loadPeers() {
      try {
        // Note: You'll need to add a /peers endpoint in your Go API
        // For now, we'll show a placeholder
        const peers = []; // await fetchJSON(`${API}/peers`);
        
        if (peers.length === 0) {
          document.getElementById("peers").innerHTML = 
            `<p style="color: #888;">Peer discovery endpoint not implemented. Add GET /peers to api/server.go</p>`;
        } else {
          let html = '';
          peers.forEach(p => {
            html += `<div class="peer-item">${p.id} - ${p.role || 'unknown'}</div>`;
          });
          document.getElementById("peers").innerHTML = html;
        }
      } catch (err) {
        document.getElementById("peers").innerHTML = `<p>Error loading peers</p>`;
      }
    }

    async function calculateTPS() {
      try {
        const txs = await fetchJSON(`${API}/txs/all`);
        const currentTxCount = txs.length;
        const now = Date.now();
        
        if (lastTxCount > 0) {
          const txDelta = currentTxCount - lastTxCount;
          const timeDelta = (now - lastTimestamp) / 1000; // seconds
          const tps = txDelta / timeDelta;
          document.getElementById("tps").textContent = tps.toFixed(2);
        }
        
        lastTxCount = currentTxCount;
        lastTimestamp = now;
      } catch (err) {
        document.getElementById("tps").textContent = "0";
      }
    }

    async function loadWorldState() {
      try {
        const plots = await fetchJSON(`${API}/state/world`);
        window.worldState = plots || [];
        state.world.page = 1;
        renderTable("world", window.worldState, 10,
          document.getElementById("search-world").value, "world");
      } catch (err) {
        document.getElementById("world").innerHTML = `<p>Error: ${err}</p>`;
      }
    }

    async function loadLatestBlock() {
      try {
        const block = await fetchJSON(`${API}/blocks/latest`);
        window.latestBlockTxs = block.txs || [];
        state.block.page = 1;
        renderTable("block", window.latestBlockTxs, 10,
          document.getElementById("search-block").value, "block");
      } catch (err) {
        document.getElementById("block").innerHTML = `<p>Error: ${err}</p>`;
      }
    }

    async function loadAllTxs() {
      try {
        const txs = await fetchJSON(`${API}/txs/all`);
        window.allTxs = txs || [];
        state.txs.page = 1;
        renderTable("txs", window.allTxs, 10,
          document.getElementById("search-txs").value, "txs");
      } catch (err) {
        document.getElementById("txs").innerHTML = `<p>Error: ${err}</p>`;
      }
    }

    async function loadTaxEvents() {
      try {
        const latest = await fetchJSON(`${API}/months/latest`);
        window.taxEvents = Array.isArray(latest) ? latest : [latest];
        state.tax.page = 1;
        renderTable("tax", window.taxEvents, 10,
          document.getElementById("search-tax").value, "tax");
      } catch (err) {
        document.getElementById("tax").innerHTML = `<p>Error: ${err}</p>`;
      }
    }

    function renderTable(id, rows, limit, query = "", key) {
      const el = document.getElementById(id);
      if (!rows || rows.length === 0) {
        el.innerHTML = "<p>No data</p>";
        return;
      }

      let filtered = rows;
      if (query) {
        const q = query.toLowerCase();
        filtered = rows.filter(r =>
          Object.values(r).some(v => String(v).toLowerCase().includes(q))
        );
      }

      const page = state[key].page;
      const start = (page - 1) * limit;
      const pageRows = filtered.slice(start, start + limit);

      const keys = Object.keys(pageRows[0] || {});
      let html = "<table><thead><tr>";
      for (let k of keys) html += `<th>${k}</th>`;
      html += "</tr></thead><tbody>";
      for (let row of pageRows) {
        html += "<tr>";
        for (let k of keys) {
          let v = row[k];
          if (typeof v === "object") v = JSON.stringify(v);
          html += `<td>${v}</td>`;
        }
        html += "</tr>";
      }
      html += "</tbody></table>";
      el.innerHTML = html;

      const totalPages = Math.ceil(filtered.length / limit) || 1;
      document.getElementById(`page-${id}`).textContent = `Page ${page} / ${totalPages}`;
      document.getElementById(`prev-${id}`).disabled = page <= 1;
      document.getElementById(`next-${id}`).disabled = page >= totalPages;
    }

    function changePage(key, delta) {
      state[key].page += delta;
      const rows = key === "world"
        ? window.worldState
        : key === "block"
        ? window.latestBlockTxs
        : key === "txs"
        ? window.allTxs
        : window.taxEvents;
      const query = document.getElementById(`search-${key}`).value;
      renderTable(key, rows, 10, query, key);
    }

    async function refresh() {
      await loadStatus();
      await loadPeers();
      await calculateTPS();
      await loadWorldState();
      await loadLatestBlock();
      await loadAllTxs();
      await loadTaxEvents();
    }

    setInterval(refresh, 10000);
    refresh();
  </script>
</body>
</html>
